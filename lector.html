<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Liderman | Lector QR</title><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script><style>body{margin:0;background:#eef3f8;color:#142d48;font:16px system-ui}header{background:#142d48;color:white;padding:20px}main{max-width:500px;margin:auto;padding:18px}video{width:100%;background:#111;border-radius:14px;min-height:180px}button{width:100%;background:#176b49;color:white;padding:17px;border:0;border-radius:10px;font: bold 17px system-ui;margin:8px 0}button:disabled{opacity:.5}p{line-height:1.5}</style></head><body><header><strong>LIDERMAN</strong><div>República Parking · lector QR en vivo</div></header><main><h2>Escanear punto de control</h2><video id="v" autoplay playsinline muted></video><button id="start">ACTIVAR CÁMARA TRASERA</button><button id="stop" style="background:#142d48">Detener cámara</button><p id="status" role="status">Preparando lector...</p><canvas id="c" hidden></canvas></main><script>
'use strict';const $=id=>document.getElementById(id),p=new URLSearchParams(location.hash.slice(1)),nonce=p.get('nonce'),parentOrigin=p.get('parent');let stream=null,running=false,generation=0,ack=false,sendTimer=null;const valid=!!(window.opener&&/^[a-f0-9]{48}$/.test(nonce||'')&&/^https:\/\/[a-z0-9.-]+\.googleusercontent\.com$|^https:\/\/script\.google\.com$/i.test(parentOrigin||''));const status=t=>$('status').textContent=t;function send(type,extra={}){if(valid)window.opener.postMessage({type,nonce,...extra},parentOrigin)}function stop(){generation++;running=false;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('v').srcObject=null;$('start').disabled=false;}async function start(){stop();const g=generation;$('start').disabled=true;try{if(!isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error('Abre esta página mediante HTTPS en Chrome o Safari.');if(!window.jsQR)throw Error('No se cargó el lector QR. Comprueba internet y recarga.');const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(g!==generation){s.getTracks().forEach(t=>t.stop());return;}stream=s;$('v').srcObject=s;await $('v').play();if(g!==generation)return;running=true;status('Cámara activa. Acerca el QR al centro de la imagen.');requestAnimationFrame(frame);}catch(e){if(g!==generation)return;stop();status('No se pudo abrir la cámara: '+e.name+' · '+e.message);}}
function frame(){if(!running)return;try{const v=$('v'),c=$('c');if(v.readyState>=2&&v.videoWidth){let scale=Math.min(1,850/Math.max(v.videoWidth,v.videoHeight));c.width=Math.round(v.videoWidth*scale);c.height=Math.round(v.videoHeight*scale);const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(v,0,0,c.width,c.height);const im=ctx.getImageData(0,0,c.width,c.height),q=jsQR(im.data,c.width,c.height,{inversionAttempts:'attemptBoth'});if(q&&q.data){stop();if(!valid){status('QR detectado. Prueba de cámara correcta; abre el lector desde la aplicación para registrar puntos.');return;}status('QR leído. Enviando a la aplicación…');$('start').disabled=true;send('QR_RESULT',{code:q.data});sendTimer=setTimeout(()=>{if(!ack){status('No se recibió confirmación. Regresa a la aplicación y vuelve a intentar. No se ha confirmado el registro.');$('start').disabled=false}},5000);return;}}requestAnimationFrame(frame);}catch(e){stop();status('Error de lectura: '+e.message)}}
window.addEventListener('message',e=>{if(!valid||e.source!==window.opener||e.origin!==parentOrigin||e.data?.nonce!==nonce||e.data?.type!=='QR_ACK')return;ack=true;clearTimeout(sendTimer);status('Código recibido por la aplicación. Regresa a la pestaña de rondas y confirma la inspección.');window.close();});$('start').onclick=start;$('stop').onclick=()=>{stop();status('Cámara detenida')};window.addEventListener('pagehide',stop);if(valid){send('QR_READY');status('Pulsa Activar cámara trasera y concede permiso.');start();}else{status('Modo de prueba de cámara. Para registrar una ronda, abre el lector desde Liderman.');}
</script></body></html>
